services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      LLM_PROVIDER: mock
      LLM_PROMPT_COST_PER_1K: "0"
      LLM_COMPLETION_COST_PER_1K: "0"

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    depends_on:
      - prometheus